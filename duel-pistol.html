<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Duel Pistol — Aritmatika Jual Beli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B1B12;
    --bg-dark:#1C1109;
    --paper:#F3E4C4;
    --paper-dark:#E4D2A9;
    --ink:#2B1B12;
    --p1:#B33A3A;
    --p1-dark:#8A2A2A;
    --p2:#3A6B8A;
    --p2-dark:#294D66;
    --gold:#D9A441;
    --good:#4A7C3F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(217,164,65,0.10), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(0,0,0,0.4), transparent 60%),
      var(--bg);
    font-family:'Manrope', sans-serif;
    color:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 16px 30px;
    touch-action:manipulation;
    overflow-x:hidden;
  }

  .titlebar{ text-align:center; margin-bottom:14px; }
  .titlebar h1{
    font-family:'Rye', serif;
    font-size:clamp(30px,5vw,52px);
    margin:0;
    color:var(--gold);
    letter-spacing:.02em;
    text-shadow:0 3px 0 rgba(0,0,0,0.5);
  }
  .titlebar p{
    margin:6px 0 0;
    font-size:14px;
    color:#D8C6A0;
  }

  .arena{
    width:100%;
    max-width:1180px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:0;
    align-items:start;
  }

  .side{
    background:var(--paper);
    border-radius:20px;
    padding:18px;
    color:var(--ink);
    position:relative;
    transition:transform .12s ease;
  }
  .side.left{ border:4px solid var(--p1); }
  .side.right{ border:4px solid var(--p2); }
  .side.hit{ animation:hitshake .35s ease; }
  @keyframes hitshake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }

  .side .name{
    font-family:'Rye', serif;
    font-size:clamp(18px,2.4vw,24px);
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .side.left .name{ color:var(--p1-dark); }
  .side.right .name{ color:var(--p2-dark); justify-content:flex-end; flex-direction:row-reverse; }

  .bullets{
    display:flex;
    gap:3px;
    margin-bottom:14px;
    flex-wrap:wrap;
    font-size:20px;
    line-height:1;
  }
  .side.right .bullets{ justify-content:flex-end; }
  .bullet{
    display:inline-block;
    transition:opacity .2s ease, filter .2s ease, transform .2s ease;
  }
  .bullet.spent{
    opacity:.28;
    filter:grayscale(1);
    transform:scale(.85);
  }

  .player-header{
    display:flex;
    align-items:flex-end;
    gap:12px;
    margin-bottom:14px;
  }
  .side.right .player-header{ flex-direction:row-reverse; }
  .player-info{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .side.right .player-info{ align-items:flex-end; }

  .cowboy-stage{ flex:none; filter:drop-shadow(0 4px 3px rgba(0,0,0,0.3)); }
  .cowboy-stage.flip{ transform:scaleX(-1); }
  .cowboy-svg{
    width:clamp(72px, 9vw, 108px);
    height:auto;
    display:block;
  }
  .cowboy-svg.flinch{ animation:flinch .3s ease; }
  .pistol{
    transform-box:fill-box;
    transform-origin:0% 55%;
  }
  .pistol.kick{ animation:gunKick .3s ease; }
  .muzzle{
    transform-box:fill-box;
    transform-origin:50% 50%;
    opacity:0;
  }
  .muzzle.show{ animation:flashPop .3s ease; }
  .shirt-p1{ fill:var(--p1); }
  .shirt-p2{ fill:var(--p2); }

  .impact-badge{
    position:absolute;
    top:14px;
    font-size:30px;
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  .side.left .impact-badge{ right:14px; }
  .side.right .impact-badge{ left:14px; }
  .impact-badge.show{ animation:flashPop .4s ease; }

  @keyframes gunKick{
    0%{ transform:translateX(0) rotate(0deg); }
    30%{ transform:translateX(9px) rotate(-16deg); }
    100%{ transform:translateX(0) rotate(0deg); }
  }
  @keyframes flashPop{
    0%{ opacity:0; transform:scale(.4); }
    35%{ opacity:1; transform:scale(1.25); }
    100%{ opacity:0; transform:scale(1); }
  }
  @keyframes flinch{
    0%{ transform:translateX(0) rotate(0deg); }
    35%{ transform:translateX(-10px) rotate(-8deg); }
    100%{ transform:translateX(0) rotate(0deg); }
  }

  .qcard{
    background:var(--paper-dark);
    border-radius:14px;
    padding:16px;
    min-height:96px;
    display:flex;
    align-items:center;
    font-weight:800;
    font-size:clamp(14px,1.7vw,17px);
    line-height:1.35;
    margin-bottom:12px;
    position:relative;
  }
  .qcard .cooldown{
    position:absolute; inset:0;
    background:rgba(43,27,18,0.85);
    color:var(--gold);
    border-radius:14px;
    display:none;
    align-items:center;
    justify-content:center;
    font-family:'Rye', serif;
    font-size:16px;
    text-align:center;
    padding:10px;
  }
  .qcard.cooling .cooldown{ display:flex; }

  .answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .ans{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:clamp(13px,1.5vw,15px);
    border:none;
    border-radius:12px;
    padding:14px 10px;
    min-height:56px;
    cursor:pointer;
    color:var(--paper);
    box-shadow:0 5px 0 rgba(0,0,0,0.25);
    transition:transform .08s ease;
  }
  .side.left .ans{ background:var(--p1); }
  .side.right .ans{ background:var(--p2); }
  .ans:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }
  .ans:disabled{ opacity:.4; cursor:default; }
  .ans.correct{ background:var(--good) !important; }
  .ans.wrong{ background:#7A2020 !important; }

  .vs{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:26px 14px 0;
    gap:10px;
  }
  .vs .badge{
    font-family:'Rye', serif;
    font-size:22px;
    color:var(--bg);
    background:var(--gold);
    border-radius:50%;
    width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 rgba(0,0,0,0.4);
  }
  .vs .guns{ font-size:26px; }

  .qcard.special{
    border:3px solid var(--gold);
    background:linear-gradient(135deg, var(--paper-dark), #F0DCA8);
  }
  .special-label{
    display:none;
    font-family:'Rye', serif;
    font-size:12px;
    color:var(--p1-dark);
    background:var(--gold);
    padding:3px 8px;
    border-radius:100px;
    margin-right:8px;
    white-space:nowrap;
  }
  .qcard.special .special-label{ display:inline-block; }

  @keyframes healGlow{
    0%{ box-shadow:0 0 0 rgba(74,124,63,0); }
    40%{ box-shadow:0 0 24px 6px rgba(74,124,63,0.55); }
    100%{ box-shadow:0 0 0 rgba(74,124,63,0); }
  }
  .side.healed{ animation:healGlow .5s ease; }

  .heal-popup{
    position:fixed;
    font-family:'Rye', serif;
    font-size:20px;
    font-weight:700;
    color:var(--good);
    text-shadow:0 2px 0 rgba(0,0,0,0.25);
    z-index:200;
    pointer-events:none;
  }

  .bullet-fx{
    position:fixed;
    width:12px;
    height:12px;
    border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--gold) 55%, transparent 80%);
    box-shadow:0 0 10px 4px rgba(217,164,65,0.85);
    z-index:150;
    pointer-events:none;
  }

  .controls{ margin-top:22px; }
  button.reset{
    font-family:'Rye', serif;
    font-size:16px;
    letter-spacing:.02em;
    color:var(--bg);
    background:var(--gold);
    border:none;
    padding:14px 32px;
    border-radius:100px;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.4);
  }
  button.reset:active{ transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,0.4); }

  .overlay{
    position:fixed; inset:0;
    background:rgba(28,17,9,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:300;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .overlay-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:22px;
    padding:44px 38px;
    text-align:center;
    max-width:420px;
    border:5px solid var(--gold);
  }
  .overlay-card h2{
    font-family:'Rye', serif;
    font-size:30px;
    margin:0 0 10px;
  }
  .overlay-card p{ margin:0 0 22px; font-weight:700; color:#4a3520; }

  @media (max-width:760px){
    .arena{ grid-template-columns:1fr; gap:14px; }
    .vs{ flex-direction:row; padding:0; order:2; }
    .side.left{ order:1; }
    .side.right{ order:3; }
    .side.right .name{ justify-content:flex-start; flex-direction:row; }
    .side.right .bullets{ justify-content:flex-start; }
  }
</style>
</head>

<script>
/* ============================================================
   BANK SOAL — Aritmatika Sosial (Transaksi Jual Beli)
   Ganti / tambah soal di sini. Format:
   { q: "teks soal", options: ["opsi1","opsi2","opsi3","opsi4"], correct: indeks jawaban benar (0-3) }
   ============================================================ */
const QUESTIONS = [
  { q: "Pedagang membeli sepatu Rp150.000 dan menjualnya Rp180.000. Berapa keuntungannya?", options: ["Rp20.000","Rp30.000","Rp40.000","Rp50.000"], correct: 1 },
  { q: "Harga beli baju Rp80.000, dijual Rp68.000. Berapa kerugiannya?", options: ["Rp8.000","Rp10.000","Rp12.000","Rp15.000"], correct: 2 },
  { q: "Toko membeli 1 lusin pensil seharga Rp24.000. Berapa harga beli tiap pensil?", options: ["Rp1.500","Rp2.000","Rp2.500","Rp3.000"], correct: 1 },
  { q: "Baju Rp100.000 didiskon 20%. Berapa harga setelah diskon?", options: ["Rp70.000","Rp75.000","Rp80.000","Rp85.000"], correct: 2 },
  { q: "Mangga dibeli Rp10.000/kg, dijual Rp12.500/kg. Berapa persen keuntungannya?", options: ["15%","20%","25%","30%"], correct: 2 },
  { q: "Barang dibeli Rp200.000, dijual rugi 10%. Berapa harga jualnya?", options: ["Rp170.000","Rp180.000","Rp190.000","Rp160.000"], correct: 1 },
  { q: "Bruto suatu barang 25kg, tara 5%. Berapa netto barang tersebut?", options: ["20kg","22,5kg","23,75kg","24kg"], correct: 2 },
  { q: "Pembeli membayar Rp50.000 untuk barang seharga Rp37.500. Berapa kembaliannya?", options: ["Rp10.000","Rp12.500","Rp15.000","Rp17.500"], correct: 1 },
  { q: "Toko roti menjual roti Rp8.000/buah dengan untung Rp2.000/buah. Berapa harga belinya?", options: ["Rp5.000","Rp6.000","Rp7.000","Rp8.000"], correct: 1 },
  { q: "Barang dibeli Rp120.000, dijual untung 15%. Berapa harga jualnya?", options: ["Rp130.000","Rp135.000","Rp138.000","Rp140.000"], correct: 2 },
  { q: "5kg beras dibeli Rp65.000, dijual lagi Rp15.000/kg. Berapa untung totalnya?", options: ["Rp5.000","Rp7.500","Rp10.000","Rp12.500"], correct: 2 },
  { q: "HP dibeli Rp2.000.000, dijual Rp1.800.000. Berapa persen kerugiannya?", options: ["5%","8%","10%","12%"], correct: 2 },
  { q: "Diskon 25% untuk barang seharga Rp240.000. Berapa besar potongan harganya?", options: ["Rp50.000","Rp55.000","Rp60.000","Rp65.000"], correct: 2 },
  { q: "10kg jeruk dibeli Rp150.000, dijual Rp18.000/kg. Untung atau rugi, berapa?", options: ["Untung Rp20.000","Untung Rp30.000","Rugi Rp20.000","Rugi Rp30.000"], correct: 1 },
  { q: "Barang Rp100.000 didiskon bertingkat 10% lalu 5%. Berapa harga akhirnya?", options: ["Rp85.000","Rp85.500","Rp86.000","Rp90.000"], correct: 1 },
  { q: "Modal pedagang Rp500.000, terjual seluruhnya Rp575.000. Berapa persen keuntungannya?", options: ["10%","12%","15%","18%"], correct: 2 }
];
const MAX_HP = 10;

/* ============================================================
   AUDIO — disintesis langsung lewat Web Audio API, tanpa file
   eksternal, supaya ringan saat di-publish ke GitHub Pages.
   ============================================================ */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playShot(){
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  // letusan noise (bagian "crack" tembakan)
  const bufferSize = Math.floor(ctx.sampleRate * 0.15);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1400, now);
  filter.frequency.exponentialRampToValueAtTime(300, now + 0.12);
  filter.Q.value = 0.7;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.9, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  noise.connect(filter).connect(noiseGain).connect(ctx.destination);
  noise.start(now);
  noise.stop(now + 0.16);

  // punch rendah supaya terasa "berat"
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(150, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.6, now);
  oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
  osc.connect(oscGain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}

function playHit(){
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  // "dug" nada rendah
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.25);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.8, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.3);

  // tekstur benturan singkat
  const bufferSize = Math.floor(ctx.sampleRate * 0.08);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 3);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.5, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  noise.connect(filter).connect(noiseGain).connect(ctx.destination);
  noise.start(now);
  noise.stop(now + 0.08);
}

function playHeal(){
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const notes = [523.25, 659.25, 783.99]; // arpeggio C5-E5-G5, nada ceria naik
  notes.forEach((freq, idx) => {
    const startT = now + idx * 0.08;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startT);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, startT);
    gain.gain.exponentialRampToValueAtTime(0.5, startT + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.25);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startT);
    osc.stop(startT + 0.26);
  });
}
/* ============================================================ */

/* Soal spesial: muncul sesekali secara acak. Jawaban benar = tambah 2 HP diri sendiri
   (bukan menyerang lawan), tidak melebihi MAX_HP. Jawaban salah tetap kena jeda 2 detik. */
const SPECIAL_QUESTIONS = [
  { q: "Soal Spesial! Toko menjual buku Rp45.000 dan untung 12,5%. Berapa harga beli buku itu?", options: ["Rp38.000","Rp39.000","Rp40.000","Rp41.000"], correct: 2 },
  { q: "Soal Spesial! Pedagang membeli 2 lusin telur seharga Rp144.000. Berapa harga tiap butir telur?", options: ["Rp5.000","Rp5.500","Rp6.000","Rp6.500"], correct: 2 },
  { q: "Soal Spesial! Baju dijual Rp150.000 setelah didiskon 25% dari harga awal. Berapa harga awalnya?", options: ["Rp180.000","Rp190.000","Rp200.000","Rp210.000"], correct: 2 },
  { q: "Soal Spesial! Barang dibeli Rp80.000, ingin untung 25%. Berapa harga jual yang harus ditetapkan?", options: ["Rp95.000","Rp100.000","Rp105.000","Rp110.000"], correct: 1 },
  { q: "Soal Spesial! Diskon membuat pembeli hanya bayar 80% dari harga awal Rp250.000. Berapa besar diskonnya?", options: ["Rp40.000","Rp45.000","Rp50.000","Rp55.000"], correct: 2 }
];
const SPECIAL_CHANCE = 0.2; // peluang 20% soal yang muncul adalah soal spesial
/* ============================================================ */

const state = {
  1: { hp: MAX_HP, current: null, cooling: false },
  2: { hp: MAX_HP, current: null, cooling: false }
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderBullets(side){
  const el = document.getElementById(`bullets-${side}`);
  el.innerHTML = "";
  for(let i=0;i<MAX_HP;i++){
    const b = document.createElement('span');
    b.className = 'bullet' + (i < state[side].hp ? '' : ' spent');
    b.textContent = '❤️';
    el.appendChild(b);
  }
}

function newQuestion(side){
  const isSpecial = Math.random() < SPECIAL_CHANCE;
  const pool = isSpecial ? SPECIAL_QUESTIONS : QUESTIONS;
  const q = pool[Math.floor(Math.random()*pool.length)];
  const optionsWithFlag = q.options.map((text, i) => ({ text, correct: i === q.correct }));
  const shuffled = shuffle(optionsWithFlag);

  state[side].current = { q: q.q, options: shuffled, special: isSpecial };

  document.getElementById(`qtext-${side}`).textContent = q.q;
  const qcard = document.getElementById(`qcard-${side}`);
  qcard.classList.remove('cooling');
  qcard.classList.toggle('special', isSpecial);

  const answersEl = document.getElementById(`answers-${side}`);
  answersEl.innerHTML = "";
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'ans';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => handleAnswer(side, opt.correct, btn));
    answersEl.appendChild(btn);
  });
}

function handleAnswer(side, correct, btn){
  if(state[side].cooling) return;
  const answersEl = document.getElementById(`answers-${side}`);
  [...answersEl.children].forEach(b => b.disabled = true);

  if(correct){
    btn.classList.add('correct');
    if(state[side].current && state[side].current.special){
      healPlayer(side);
    } else {
      shoot(side);
    }
  } else {
    btn.classList.add('wrong');
    startCooldown(side);
  }
}

function shoot(shooterSide){
  const targetSide = shooterSide === 1 ? 2 : 1;

  playShot();
  fireGunslinger(shooterSide);
  fireBullet(shooterSide);

  setTimeout(() => {
    state[targetSide].hp = Math.max(0, state[targetSide].hp - 1);
    renderBullets(targetSide);
    playHit();

    const targetEl = document.getElementById(`side-${targetSide}`);
    targetEl.classList.add('hit');
    setTimeout(() => targetEl.classList.remove('hit'), 350);

    const targetCowboy = document.getElementById(`cowboy-${targetSide}`);
    targetCowboy.classList.remove('flinch');
    void targetCowboy.offsetWidth;
    targetCowboy.classList.add('flinch');

    const impact = document.getElementById(`impact-${targetSide}`);
    impact.classList.remove('show');
    void impact.offsetWidth;
    impact.classList.add('show');

    if(state[targetSide].hp <= 0){
      endGame(shooterSide);
    } else {
      setTimeout(() => newQuestion(shooterSide), 250);
    }
  }, 380);
}

function healPlayer(side){
  playHeal();
  state[side].hp = Math.min(MAX_HP, state[side].hp + 2);
  renderBullets(side);
  showHealPopup(side);

  const selfEl = document.getElementById(`side-${side}`);
  selfEl.classList.remove('healed');
  void selfEl.offsetWidth;
  selfEl.classList.add('healed');

  setTimeout(() => newQuestion(side), 500);
}

function showHealPopup(side){
  const bulletsEl = document.getElementById(`bullets-${side}`);
  const rect = bulletsEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'heal-popup';
  el.textContent = '+2 ❤️';
  el.style.left = (rect.left + rect.width / 2) + 'px';
  el.style.top = rect.top + 'px';
  document.body.appendChild(el);

  el.animate([
    { transform: 'translate(-50%, 0)', opacity: 1 },
    { transform: 'translate(-50%, -30px)', opacity: 0 }
  ], { duration: 700, easing: 'ease-out' });

  setTimeout(() => el.remove(), 720);
}

function fireGunslinger(shooterSide){
  const pistol = document.getElementById(`pistol-${shooterSide}`);
  const muzzle = document.getElementById(`muzzle-${shooterSide}`);

  pistol.classList.remove('kick');
  void pistol.offsetWidth;
  pistol.classList.add('kick');

  muzzle.classList.remove('show');
  void muzzle.offsetWidth;
  muzzle.classList.add('show');
}

function fireBullet(shooterSide){
  const targetSide = shooterSide === 1 ? 2 : 1;
  const fromEl = document.getElementById(`pistol-${shooterSide}`);
  const toEl = document.getElementById(`impact-${targetSide}`);
  const fromRect = fromEl.getBoundingClientRect();
  const toRect = toEl.getBoundingClientRect();

  const fx = document.createElement('div');
  fx.className = 'bullet-fx';
  const startX = fromRect.left + fromRect.width / 2;
  const startY = fromRect.top + fromRect.height / 2;
  fx.style.left = startX + 'px';
  fx.style.top = startY + 'px';
  document.body.appendChild(fx);

  const endX = toRect.left + toRect.width / 2;
  const endY = toRect.top + toRect.height / 2;

  fx.animate([
    { transform: 'translate(0,0)', opacity: 1 },
    { transform: `translate(${endX - startX}px, ${endY - startY}px)`, opacity: 1 }
  ], { duration: 320, easing: 'ease-in' });

  setTimeout(() => fx.remove(), 330);
}

function startCooldown(side){
  state[side].cooling = true;
  const qcard = document.getElementById(`qcard-${side}`);
  const cdnum = document.getElementById(`cdnum-${side}`);
  qcard.classList.add('cooling');

  let remaining = 2;
  cdnum.textContent = remaining;
  const interval = setInterval(() => {
    remaining -= 1;
    cdnum.textContent = Math.max(remaining, 0);
    if(remaining <= 0) clearInterval(interval);
  }, 1000);

  setTimeout(() => {
    state[side].cooling = false;
    newQuestion(side);
  }, 2000);
}

function endGame(winnerSide){
  document.getElementById('overlayTitle').textContent = `🏆 Pemain ${winnerSide} Menang!`;
  setTimeout(() => document.getElementById('overlay').classList.add('show'), 400);
}

function startGame(){
  state[1] = { hp: MAX_HP, current: null, cooling: false };
  state[2] = { hp: MAX_HP, current: null, cooling: false };
  document.getElementById('overlay').classList.remove('show');
  renderBullets(1);
  renderBullets(2);
  newQuestion(1);
  newQuestion(2);
}

document.getElementById('resetBtn').addEventListener('click', startGame);
document.getElementById('playAgainBtn').addEventListener('click', startGame);

startGame();
</script>
